# ── Identity & Provenance ─────────────────────────────────
schema_version: "1.1"
layer: SIGNAL
alpha_id: sig_benign_midcap_v1
version: "1.0.0"

# Research-only: blocks PAPER/LIVE promotion; backtests are unaffected.
#
# Decided 2026-08-12 on the re-measurement in the cost-arithmetic block below.
# Over 15 tradeable cached APP sessions, at the size this alpha's own
# capital_allocation_pct funds, it realizes gross -2.77 across 149 fills --
# indistinguishable from zero -- and nets -376.45 after 373.68 in fees.
#
# The earlier +383.40 gross came from runs where platform_min_order_shares
# inflated every target to 50 shares, ~2.4x what the risk budget sanctioned.
# That made the story "gross-positive, cost-negative" (a real edge lost to the
# spread, arguably fixable by cheaper execution). At the funded size there is no
# gross edge to lose, which is a different and worse finding: Inv-1 asks what
# causal force is being exploited, and this data does not evidence one at this
# scale.
#
# NOT a claim that the mechanism is wrong. It is one symbol over 15 sessions,
# and the cache holds no second mid-cap to generalize against (AAPL and SPY sit
# outside the declared universe and produced 4 and 0 fills). The cap says
# "not promotable on this evidence", not "disproven" -- lifting it needs data,
# not reanalysis.
lifecycle_state: RESEARCH
description: |
  Kyle-style informed-flow footprint on L1 (OFI + micro-price vs mid)
  in the benign / normal microstructure regime for mid-cap names.
  Institutional parent fills often arrive as VWAP/TWAP slices; those
  waves imprint the same directional imbalance this alpha reads.  The
  regime gate suppresses toxic / breakout states where the footprint
  mean-reverts or inverts.

# ── Hypothesis (causal mechanism) ─────────────────────────
hypothesis: |
  When informed trading pressure is present but transient-impact
  conditions remain orderly (low spread z-score, HMM normal-regime
  posterior elevated), persistent same-sign OFI and micro-price tilt
  relative to mid reveal a Kyle-style information footprint on L1.
  VWAP/TWAP parent slicing is a common *execution modality* that
  produces such footprints; the tradeable claim is the footprint
  itself, not the algorithm tag.  Conditional on the HMM ``normal``
  posterior and mild spreads, residual mid drift over the 120-second
  horizon aligns with the signed imbalance; the signal sizes exposure
  by standardised OFI rather than by parent-order identifiers (which
  are unobserved).

falsification_criteria:
  - |
    Spearman correlation between ofi_ewma over the prior 120s and
    return over the next 120s drops below 0.05 in the normal regime
    for >= 4 consecutive weeks.  (Mechanism requires sustained
    positive correlation; loss indicates parent-order behaviour
    has changed or the signature is saturated.)
  - |
    Out-of-sample DSR (deflated Sharpe ratio) below 1.0 across any
    single calendar quarter after promotion to LIVE.
  - |
    SEC/FINRA mandates execution transparency that eliminates the
    VWAP/TWAP slicing advantage; the parent-order leakage signature
    disappears from L1 entirely.
  - |
    Realised volatility enters a sustained high regime (HMM
    posterior P(vol_breakout) > 0.5 for > 30 trading days); the
    on-condition becomes unreachable and the strategy is inactive.

# ── Layer-1 sensor dependencies ───────────────────────────
# Every dependency is resolved at boot and consumed below.
depends_on_sensors:
  - ofi_ewma
  - book_imbalance
  - spread_z_30d
  - realized_vol_30s

# ── Universe ──────────────────────────────────────────────
# Universe selection is config-driven (mid-cap subset of the
# active platform symbols).  No static list is pinned here; the
# operator restricts via ``platform.yaml`` for the deployment.

# ── Parameters ────────────────────────────────────────────
parameters:
  entry_threshold_z:
    type: float
    default: 0.8
    min: 0.5
    max: 3.0
    description: |
      Entry trigger on |ofi_ewma_zscore|.  ~2.5% tail of the
      normal-regime OFI z-score distribution at the default value.
  edge_per_z_bps:
    type: float
    default: 4.0
    min: 1.0
    max: 8.0
    description: |
      Linear extrapolation slope from |z| to expected edge in bps.
      Capped at edge_cap_bps to avoid extrapolation tail risk.
  edge_cap_bps:
    type: float
    default: 20.0
    min: 5.0
    max: 50.0
    description: |
      Maximum reported ``edge_estimate_bps``; safety cap.
  strength_cap:
    type: float
    default: 2.0
    min: 1.0
    max: 4.0
    description: |
      Ceiling for convex strength scaling.  Signals at |z| == threshold*2
      still produce strength==1.0 (backward-compatible floor); the cap
      allows high-z signals to size proportionally larger up to this
      multiple of the base unit size.
  imbalance_floor:
    type: float
    default: 0.05
    min: 0.0
    max: 0.5
    description: |
      Minimum |book_imbalance_mean| for same-side queue confirmation. The
      epsilon band prevents a near-zero horizon mean from passing.
  cost_floor_bps:
    type: float
    default: 5.0
    min: 5.0
    max: 30.0
    description: |
      One-way cost floor (bps). Suppress entries whose computed ``edge_bps``
      does not exceed the disclosed one-way cost
      (half_spread + impact + fee = 2.0 + 2.0 + 1.0 = 5.0). Without it the
      alpha emits entries with edge as low as 3.2 bps (|z| at the default
      0.8 threshold). The round-trip Inv-12 bar (~1.5x round-trip) is
      enforced at runtime by the B4 gate. Keep aligned with
      cost_arithmetic.
# ── Horizon (Layer-2 boundary) ────────────────────────────
horizon_seconds: 120

# ── Risk Budget ───────────────────────────────────────────
risk_budget:
  max_position_per_symbol: 500
  max_gross_exposure_pct: 25.0
  max_drawdown_pct: 1.0
  capital_allocation_pct: 25.0

# ── Regime gate ───────────────────────────────────────────
regime_gate:
  regime_engine: hmm_3state_fractional
  on_condition: |
    P(normal) > 0.5 and spread_z_30d < 1.5
  off_condition: |
    P(normal) < 0.35 or spread_z_30d > 3.0 or realized_vol_30s_zscore > 4.5

# ── Cost Arithmetic Disclosure (G12) ──────────────────────
#
# RE-MEASURED 2026-08-12 — the 2026-08-09 figures below described a position
# size this alpha never declared, so they are superseded.
#
# `platform_min_order_shares: 50` used to raise every sized target up to 50,
# and this alpha's `capital_allocation_pct: 25.0` asks for only 15-31 shares at
# 50k equity and APP near $396.  So the measured book was ~2.4x the sanctioned
# size.  The floor no longer inflates targets; these are the same 15 tradeable
# cached APP sessions, replayed independently (no drawdown lockout carries
# between them) under configs/bt_sig_benign_midcap.yaml, at the size the risk
# budget actually authorises:
#
#                        SANCTIONED (2026-08-12)   INFLATED (2026-08-09)
#     fills                        149                     154
#     shares                     2,378                  ~7,700
#     gross realized             -2.77                +383.40
#     fees                      373.68               1,003.57
#     NET                      -376.45                -620.17
#     net per fill               -2.53                   -4.03
#     net-positive             7 of 15                 7 of 15
#
# The verdict is unchanged — net-negative across the corpus, not promotable —
# but the *diagnosis* changes materially, and the new one is worse.
#
# At the inflated size the story was "gross-positive, cost-negative": the alpha
# found the footprint it claims and handed the proceeds to the spread.  At the
# sanctioned size gross realized is -2.77 over 149 fills, i.e. indistinguishable
# from zero.  There is no gross edge for the fees to eat.  This is not "good
# signal, bad execution"; it is no measurable signal at the scale this alpha is
# funded for.
#
# Caveat, load-bearing: these are NOT the same trades at a smaller size.  Order
# quantity feeds the passive-limit fill model (queue position, partial fills,
# whether a resting order fills at all), so halving the size changes which
# orders fill and when.  Gross did not scale linearly — linear scaling from
# +383.40 would have predicted roughly +157, not -2.77 — so the difference is a
# different realized path, not arithmetic.  Do not interpolate between the two
# columns.
#
# The -75.10 bps realized-edge figure quoted in the 2026-08-09 note came from an
# edge-calibration artifact built on the inflated runs.  It has NOT been
# recomputed here and should be treated as stale, not as evidence at this size.
#
# `edge_estimate_bps: 9.0` below is left as declared.  Re-disclosing an alpha's
# edge is an authoring decision with G12/Inv-12 consequences, not a measurement
# side effect; the gap between 9.0 and what is realized is the finding, and it
# is wider now, not narrower.
#
# The 9.0 above is entry_threshold_z 1.5 x edge_per_z_bps 6.0 from the config
# overrides, which are *tighter* than this spec's defaults (0.8 / 4.0).  The
# result is from the more selective configuration, not a loose one.
#
# Consequences worth knowing before promoting:
#   * At the inflated size, 6 of 15 sessions breached risk_budget.max_drawdown_pct
#     on their own (worst single-session loss 371.01 against a 125.00 budget at
#     25% of 50k equity).  At the sanctioned size the worst single session is
#     -185.59 (2026-06-04), so the per-session breach count is lower — but that
#     is a consequence of trading less, not of trading better, and the drawdown
#     consequences below still apply once a lockout latches.
#     Over a contiguous window the budget latches on day 1 and the alpha is
#     rejected for the rest of the run — 3 fills over 2026-06-01..06-12.  That
#     lockout is the risk engine working, not a defect, but it also means the
#     30-fill edge-calibration bar is unreachable in one window, so no haircut is
#     ever produced from real data.
#   * Loosening the drawdown budget would not fix this.  It would let a
#     cost-negative alpha trade longer.
#
# NOT generalized beyond APP.  A cross-symbol attempt on AAPL and SPY produced 4
# and 0 fills — both are outside this alpha's declared universe ("mid-cap
# names"), so it correctly declined to trade them and the run says nothing about
# fee economics.  The cache holds no second midcap with meaningful session count,
# so whether this is APP-specific or alpha-wide is open and needs data, not
# reanalysis.
cost_arithmetic:
  edge_estimate_bps: 9.0
  half_spread_bps: 2.0
  impact_bps: 2.0
  fee_bps: 1.0
  margin_ratio: 1.8
  # One-way disclosure; the runtime gate checks round-trip survival.
  cost_basis: one_way

# KYLE_INFO is represented by standardized OFI confirmed by book imbalance.
# Each signature sensor is also a consumed dependency.
trend_mechanism:
  family: KYLE_INFO
  expected_half_life_seconds: 120
  l1_signature_sensors:
    - book_imbalance
    - ofi_ewma
    - spread_z_30d
  failure_signature:
    - "spread_z_30d > 3.0"
    - "P(vol_breakout) > 0.5"

# ── Signal (Layer-2 evaluate) ─────────────────────────────
signal: |
  def evaluate(snapshot, regime, params):
      threshold = params["entry_threshold_z"]
      slope_bps = params["edge_per_z_bps"]
      edge_cap = params["edge_cap_bps"]
      str_cap = params["strength_cap"]

      z = snapshot.values.get("ofi_ewma_zscore")
      # Confirm OFI with horizon-mean top-of-book imbalance.
      imb = snapshot.values.get("book_imbalance_mean")
      if z is None or imb is None:
          return None

      mag = abs(z)
      if mag < threshold:
          return None

      # Treat near-zero mean imbalance as no confirmation.
      if abs(imb) < params["imbalance_floor"]:
          return None
      # Require book imbalance aligned with signed OFI (L1 footprint).
      if (z > 0.0 and imb < 0.0) or (z < 0.0 and imb > 0.0):
          return None

      direction = LONG if z > 0 else SHORT
      edge_bps = min(mag * slope_bps, edge_cap)

      # Do not emit entries below disclosed one-way cost.
      if edge_bps <= params["cost_floor_bps"]:
          return None

      # Convex strength rewards signals beyond twice the threshold.
      norm = mag / (threshold * 2.0)
      # Scale linearly below saturation and convexly above it, capped at str_cap.
      if norm <= 1.0:
          strength = norm
      else:
          strength = min(1.0 + (norm - 1.0) ** 1.2, str_cap)

      return Signal(
          timestamp_ns=snapshot.timestamp_ns,
          correlation_id=snapshot.correlation_id,
          sequence=snapshot.sequence,
          symbol=snapshot.symbol,
          strategy_id="sig_benign_midcap_v1",
          direction=direction,
          strength=strength,
          edge_estimate_bps=edge_bps,
      )
