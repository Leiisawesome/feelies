# FIX-2 — shape-adversarial SHORT. Same horizon as shape_adv_long; evaluate
# always emits SHORT at a lower composite score so Top-1 has a determined
# loser.
schema_version: "1.1"
layer: SIGNAL
alpha_id: shape_adv_short
version: "1.0.0"
lifecycle_state: RESEARCH
description: |
  Conformance fixture. Always-SHORT evaluate, different shape from
  shape_adv_long (direction, strength, edge). C6's second forecast.

hypothesis: |
  None. Fixture for the G15 accounting identity.

falsification_criteria:
  - evaluate returns None on any snapshot (the fixture would then not compete).

depends_on_sensors:
  - ofi_ewma

parameters: {}

horizon_seconds: 30

risk_budget:
  max_position_per_symbol: 1
  max_gross_exposure_pct: 0.1
  max_drawdown_pct: 0.1
  capital_allocation_pct: 0.1

regime_gate:
  regime_engine: hmm_3state_fractional
  on_condition: "True"
  off_condition: "False"

cost_arithmetic:
  edge_estimate_bps: 9.0
  half_spread_bps: 2.0
  impact_bps: 2.0
  fee_bps: 1.0
  margin_ratio: 1.8
  cost_basis: one_way

signal: |
  def evaluate(snapshot, regime, params):
      return Signal(
          timestamp_ns=snapshot.timestamp_ns,
          correlation_id=snapshot.correlation_id,
          sequence=snapshot.sequence,
          symbol=snapshot.symbol,
          strategy_id="shape_adv_short",
          direction=SHORT,
          strength=0.4,
          edge_estimate_bps=5.0,
      )
