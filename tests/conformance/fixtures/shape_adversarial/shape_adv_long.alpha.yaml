# FIX-2 — shape-adversarial LONG. Same horizon and sensor as FIX-1, but
# evaluate always emits LONG. Paired with shape_adv_short so C6 is not
# the A=1 identity.
schema_version: "1.1"
layer: SIGNAL
alpha_id: shape_adv_long
version: "1.0.0"
lifecycle_state: RESEARCH
description: |
  Conformance fixture. Always-LONG evaluate so a second, differently-shaped
  alpha exists in-tree for C6. No economic claim.

hypothesis: |
  None. Fixture for the G15 accounting identity.

falsification_criteria:
  - evaluate returns None on any snapshot (the fixture would then not compete).

depends_on_sensors:
  - ofi_ewma

parameters: {}

horizon_seconds: 30

risk_budget:
  max_position_per_symbol: 1
  max_gross_exposure_pct: 0.1
  max_drawdown_pct: 0.1
  capital_allocation_pct: 0.1

regime_gate:
  regime_engine: hmm_3state_fractional
  on_condition: "True"
  off_condition: "False"

cost_arithmetic:
  edge_estimate_bps: 20.0
  half_spread_bps: 2.0
  impact_bps: 2.0
  fee_bps: 1.0
  margin_ratio: 4.0
  cost_basis: one_way

signal: |
  def evaluate(snapshot, regime, params):
      return Signal(
          timestamp_ns=snapshot.timestamp_ns,
          correlation_id=snapshot.correlation_id,
          sequence=snapshot.sequence,
          symbol=snapshot.symbol,
          strategy_id="shape_adv_long",
          direction=LONG,
          strength=1.0,
          edge_estimate_bps=20.0,
      )
