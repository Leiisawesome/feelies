# =============================================================
#   R-03 — upstream SIGNAL for the PORTFOLIO tape
#   ----------------------------------------------------------------
#   Feeder for null_portfolio. evaluate returns None unconditionally,
#   so no Signal exists and the book stays flat (FIX-1 conservation).
#   Universe stays inside {AAPL, MSFT} so _synth_events is reusable.
# =============================================================

schema_version: "1.1"
layer: SIGNAL
alpha_id: upstream_null
version: "1.0.0"
description: |
  Conformance feeder for the PORTFOLIO reset-invocation tape. Emits
  no Signal so composition constructs the four PORTFOLIO objects
  without moving the book.

hypothesis: |
  None. This fixture exploits no structural mechanism; it exists so a
  PORTFOLIO spec can declare depends_on_signals without introducing alpha.

falsification_criteria:
  - |
    The fixture emits a Signal. Its evaluate returns None on every input,
    so a single emission means the Layer-2 evaluation path is inventing
    signals rather than relaying them.

symbols:
  - AAPL
  - MSFT

depends_on_sensors:
  - ofi_ewma

horizon_seconds: 300

regime_gate:
  regime_engine: hmm_3state_fractional
  on_condition: "True"
  off_condition: "False"

cost_arithmetic:
  edge_estimate_bps: 9.0
  half_spread_bps: 2.0
  impact_bps: 2.0
  fee_bps: 1.0
  margin_ratio: 1.8
  cost_basis: one_way

signal: |
  def evaluate(snapshot, regime, params):
      return None
