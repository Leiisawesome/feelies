# Lint, types, and the deterministic test suite on every push and PR.
#
# Until now nothing ran the suite automatically: `main` was unprotected and the
# only signal on a PR was a review bot reading the diff. The 2026-08 architecture
# review found six defects hiding behind fixtures that covered the one input shape
# the buggy logic handled, and separately found `main` red on a Saturday because
# an RTH skip guard never checked the weekday (#223). Neither is caught by reading
# a diff.
#
# HOST SENSITIVITY — answered 2026-08-08, run 31262226139.
# parity_manifest.py warns that hashes involving transcendental math are stable
# only for a fixed platform and libm, and several manifest-registered replays run
# the regime HMM, so the matrix ran ubuntu and macos to find out whether the
# locked baselines (minted on macOS) survive glibc. Both hosts produced
# 4600 passed / 5 skipped / 43 deselected — identical counts, every locked hash
# reproduced. The registered corpus is portable, so the matrix collapses to
# ubuntu and that warning now applies only to the *unregistered* host-sensitive
# hashes, which is precisely why they are exempted from the manifest.
#
# Do not "fix" a determinism failure here by re-baselining. A hash that differs
# across libm is a portability fact about the corpus, not drift in the code —
# re-pin only after establishing which of the two it is.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded push should not keep burning a runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # One host today. The matrix is kept so re-adding macos to re-test the
      # host-portability claim above is a one-line change, and `fail-fast: false`
      # so that when it is re-added one host failing cannot hide the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    env:
      # Inv-5 is contractually pinned here (conftest.py, three_layer_architecture
      # §12.5) and the suite warns when it is unset. The pin is a backstop, not a
      # crutch: the tick-path set-ordering dependency was removed, so a non-zero
      # seed does not by itself break replay. See the unpinned step below, which
      # is what actually holds that claim up.
      PYTHONHASHSEED: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # `requires-python = ">=3.12"` lets uv pick whatever is newest, so the
          # interpreter could move under the locked baselines without anyone
          # choosing it. Pin the minor version and change it deliberately.
          python-version: "3.13"

      - name: Sync all extras
        # `dev`, `massive`, `portfolio`, and `ib` are all required — without them
        # the mypy acceptance test (test_mypy_strict_clean_on_src_feelies) cannot
        # resolve imports and fails for the wrong reason.
        #
        # `--locked` fails the run on a stale `uv.lock` rather than silently
        # re-resolving it, so CI tests the dependency set the repo committed.
        run: uv sync --all-extras --locked

      - name: Lint
        # scripts/ added 2026-08-12. It had been outside every gate and had
        # accumulated five errors nobody saw — CI linted src/ and tests/ only,
        # so a directory that ships operator entry points drifted unchecked.
        run: uv run ruff check src/ tests/ scripts/

      - name: Format
        run: uv run ruff format --check src/ tests/ scripts/

      - name: Types
        run: uv run mypy src/feelies

      - name: Tests
        # `functional` needs a live Massive key; `paper_rth` needs IB Gateway and
        # an open US market. Both self-skip, but deselecting is explicit and keeps
        # a skip from quietly becoming a failure the way it did in #223.
        # `slow` stays selected — it carries the mypy scope acceptance test.
        run: uv run pytest -m "not functional and not paper_rth" -q

      - name: Determinism under an unpinned hash seed
        # Everything above runs at PYTHONHASHSEED=0, which means none of it can
        # catch a *newly introduced* dependence on set/dict iteration order — the
        # defect class the pin documents and the tick-path `sorted(...)` calls
        # exist to prevent. A backstop nothing ever runs without is not a backstop.
        #
        # Replaying the locked corpus under a random seed is what exercises the
        # claim. Verified green at seeds 1, 12345 and 99999 before this step
        # existed, so a failure here is a new dependence rather than a pre-existing
        # one. The conftest warning about the unpinned seed is expected here.
        #
        # Do not "fix" a failure by pinning the seed back or re-baselining; find
        # the set or dict whose iteration order reached an output and sort it.
        env:
          PYTHONHASHSEED: random
        run: uv run pytest tests/determinism/ -q

  parity-oracle:
    # The APP/2026-03-26 replay baseline — the strongest regression guard in the
    # repo, and until 2026-08-12 the one thing CI never ran.
    #
    # It pins the trade parity hash, net PnL and fill count. It is marked
    # `functional` because it needs a populated disk cache, so `check` above
    # deselects it; only its cache-free config-hash assertion ran. A change could
    # therefore move the parity hash with CI fully green, and one did (the
    # min-order-floor commit) — caught by hand, not here.
    #
    # FEELIES_REQUIRE_BASELINE_CACHE=1 turns a cache miss from a green skip into
    # a failure, so this job cannot pass without actually replaying.
    name: parity oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Fork PRs get no secrets, so the cache can be neither restored-with-key nor
    # repopulated. Skipping is stated rather than silently passing.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      PYTHONHASHSEED: "0"
      FEELIES_REQUIRE_BASELINE_CACHE: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync all extras
        run: uv sync --all-extras --locked

      - name: Restore APP baseline event cache
        uses: actions/cache@v4
        with:
          path: ~/.feelies/cache
          # A historical session never changes, so the key is static. Bump the
          # suffix to force a refetch if the normalizer's on-disk format moves.
          key: feelies-eventcache-APP-2026-03-26-v1

      - name: Populate cache on miss
        # Fetching needs the Massive key. If the cache missed and no key is
        # configured, fail here with the reason rather than letting the next
        # step report a confusing replay error.
        run: |
          if [ -f "$HOME/.feelies/cache/APP/2026-03-26.jsonl.gz" ]; then
            echo "cache hit — skipping fetch"
            exit 0
          fi
          if [ -z "${MASSIVE_API_KEY}" ]; then
            echo "::error::APP/2026-03-26 event cache missing and MASSIVE_API_KEY is not configured, so it cannot be fetched. Add the secret, or prime the actions/cache entry from a run that has it."
            exit 1
          fi
          uv run feelies backtest --config configs/bt_app.yaml \
            --symbol APP --date 2026-03-26 >/dev/null
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}

      - name: Replay the locked APP baseline
        # `-m ""` clears the default marker filter so the functional test is
        # selected; without it this job would pass by deselecting its own subject.
        run: uv run pytest tests/acceptance/test_backtest_app_baseline.py -q -m ""
