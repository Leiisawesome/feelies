# Two-sided netting contest — RESEARCH ONLY, NOT FOR CAPITAL.
#
# The portfolio netter only differs from winner-take-all arbitration when two
# SIGNAL alphas hold opposing standing targets on one symbol. No shipped pair
# does: sweeping the standalone harness over all 33 replayable cached sessions
# produced exactly one divergence, and it was one real target against one zero.
#
# `sig_contra_fixture_v1` mirrors `sig_benign_midcap_v1` and inverts the
# direction, so every tick where benign takes a side the fixture takes the other.
# That manufactures the contest the cache cannot supply, which is what the
# flat-vs-live semantics decision has been blocked on.
#
# MEASURED 2026-08-09 — 15 cached APP sessions, this config:
#
#     108 net divergences
#       105  opposite sides, both live   (winner +253 vs net -247, and similar)
#         3  winner FLAT, net live       (the case the recorded decision is about)
#
# Against 1 divergence across all 33 replayable sessions with the shipped alphas
# alone, and that one was "one real target against one zero". Both shapes the
# flat-vs-live semantics question needs are now observable in quantity, which is
# what it was blocked on.
#
# Usage:
#   uv run python scripts/run_backtest.py --config configs/bt_netting_contest.yaml \
#       --symbol APP --date 2026-03-26
extends: ../platform.yaml

symbols:
  - APP

alpha_specs:
  - alphas/sig_benign_midcap_v1/sig_benign_midcap_v1.alpha.yaml
  - alphas/sig_contra_fixture_v1/sig_contra_fixture_v1.alpha.yaml

# Sizing must escape the minimum-order clamp or this whole config measures nothing.
# At platform.yaml's 50,000 equity and APP near $396, every sized target lands
# under _min_order_shares (50) and is clamped up to exactly 50 — for both alphas,
# whatever their capital_allocation_pct. The mirror then cancels to a net of zero
# and the only shape ever observed is "arbitration holds +/-50, netting holds 0".
# Ten times the equity puts both targets above the clamp, so allocation
# differentiates them and the net can land on the opposite side of the winner.
account_equity: 500000.0

prune_unused_sensors: true
signal_min_edge_cost_ratio: 1.5

# Mirrored on both sides — the pair must be gated alike or the contest degrades
# back into one-real-target-against-one-zero.
parameter_overrides:
  sig_benign_midcap_v1:
    entry_threshold_z: 1.5
    edge_per_z_bps: 6.0
  sig_contra_fixture_v1:
    entry_threshold_z: 1.5
    edge_per_z_bps: 6.0
