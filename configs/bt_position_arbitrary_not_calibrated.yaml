extends: bt_app.yaml
alpha_specs:
  - tests/position_engine/fixtures/sig_position_fixture_v1.alpha.yaml
risk_max_gross_exposure_pct: 80.0
stop_loss_pct: 0
stop_loss_per_share: 0
trail_activate_pct: 0
trail_activate_per_share: 0
sensor_specs:
  - sensor_id: spread_z_30d
    sensor_version: "1.1.0"
    cls: feelies.sensors.impl.spread_z_30d.SpreadZScoreSensor
    params: {window: 6000, min_std: 1.0e-9, max_gap_seconds: 300}
    subscribes_to: [NBBOQuote]
    input_sensor_ids: []
    min_history: 6000
  - sensor_id: ofi_ewma
    sensor_version: "1.1.0"
    cls: feelies.sensors.impl.ofi_ewma.OFIEwmaSensor
    params:
      decay_tau_seconds: 10.0
      max_gap_seconds: 300
      normalize_by_depth: true
      depth_floor: 1.0
      warm_after: 50
      warm_window_seconds: 300
    subscribes_to: [NBBOQuote]
    input_sensor_ids: []
    min_history: 50
  - sensor_id: book_imbalance
    sensor_version: "1.0.0"
    cls: feelies.sensors.impl.book_imbalance.BookImbalanceSensor
    params: {warm_after: 1, warm_window_seconds: 60, imbalance_cap: 0.95}
    subscribes_to: [NBBOQuote]
    input_sensor_ids: []
    min_history: 1
  - sensor_id: realized_vol_30s
    sensor_version: "1.3.0"
    cls: feelies.sensors.impl.realized_vol_30s.RealizedVol30sSensor
    params: {window_seconds: 30, warm_after: 16}
    subscribes_to: [NBBOQuote]
    input_sensor_ids: []
    min_history: 16
