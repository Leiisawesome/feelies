# Multi-alpha backtest config — STANDALONE-SIGNAL collision harness (research only).
#
# Purpose: exercise cross-alpha interaction on one symbol without a PORTFOLIO
# alpha — EdgeWeightedArbitrator collisions, standing-signal overlap, per-alpha
# cost-survival in the backtest report, and exit-hijack regression checks via
# ``scripts/compare_multialpha_runs.py``.
#
# RESEARCH HARNESS, NOT A CAPITAL CONFIG: standalone mode allows at most one
# order walk per tick and arbitrates overlapping SIGNAL alphas lossily — the
# winner takes the tick and the other alphas' conviction is discarded, not
# blended.  That limitation is real and is what this config exists to measure.
#
# It does NOT follow that the PORTFOLIO composition path is the production
# answer.  An earlier revision of this comment said production multi-alpha books
# "must" use a PORTFOLIO alpha with ``depends_on_signals``; that was asserted,
# never measured, and the repository decided otherwise (BT-13):
#
#   * No config here loads a PORTFOLIO alpha — not platform.yaml, not any
#     bt_*.yaml, not either paper_*.yaml.
#   * Both PORTFOLIO alphas are ``lifecycle_state: RESEARCH`` under
#     alphas/research/, and pro_kyle_benign_v1's own notes read
#     "Decommissioned from production discovery" — IR = IC·sqrt(N) at N=3 does
#     not justify the composition layer at this capital scale.
#   * Measured 2026-08-12 on the cached corpus: a purpose-built 2-symbol
#     PORTFOLIO alpha over {APP, AAPL} on 2026-03-26 formed 78 cross-sectional
#     contexts and emitted 78 SizedPositionIntents, every one of them degenerate
#     (empty ``target_positions``), for 0 orders and 0 fills.  Completeness never
#     exceeded 0.5 against a 0.80 threshold; forcing the threshold to its 0.5
#     schema floor let 12 through and still produced zero targets, because
#     ``_standardize`` returns zero weight whenever only one name is active
#     (std == 0).  Composition needs >= ceil(0.8N) symbols carrying fresh,
#     differently-scored signals at the same boundary.
#   * The composition path used to be the *less* gated of the two: its legs
#     skipped the halt blackout, session-flatten window, SSR, locate/borrow and
#     ``platform_min_order_shares``.  Those five now run for both paths from one
#     policy (``feelies.execution.order_admission``).
#
#     What remains is one gap, not two.  Composition legs bypass the Inv-12 B4
#     edge/cost gate *and* route MARKET unconditionally for the same reason:
#     both decisions are edge-conditioned, and a composition leg has no edge.
#     ``CrossSectionalRanker`` folds each signal's ``edge_estimate_bps`` into a
#     raw score and then z-scores it into a relative rank; ``TargetPosition``
#     carries only ``symbol`` / ``target_usd`` / ``urgency``.  A weight of +1.2
#     is an ordering, not an expected return in bps.
#
#     Closing it is therefore a specification change — ``TargetPosition`` must
#     carry a per-symbol expected edge the pipeline does not currently compute —
#     not a port of the standalone code.  Do not substitute the alpha's static
#     ``cost_arithmetic.edge_estimate_bps``: one constant per alpha against
#     per-leg cost either always passes or always fails, which is worse than no
#     gate because it looks like one.
#
# So: neither path is currently production-blessed for a multi-alpha book.
# Standalone is lossy; composition is unexercised and under-gated.  Choosing
# between them is an open decision, not a settled one.
#
# Usage:
#   uv run python scripts/run_backtest.py --config configs/bt_multialpha.yaml \
#       --symbol APP --date 2026-03-26
#
#   uv run python scripts/compare_multialpha_runs.py --symbol APP --date 2026-03-26 \
#       --strict
extends: ../platform.yaml

symbols:
  - APP

# A momentum + drift + mean-reversion mix on the same symbol so the net both
# STACKS (benign + kyle, same direction) and OFFSETS (vs inventory-revert).
# sig_kyle_drift_v1 is what makes this a collision harness at all.  Without it
# only sig_benign_midcap_v1 emits on the cached APP sessions —
# sig_inventory_revert_v1's gate additionally requires ``dominant == "normal"``
# and ``P(normal) > 0.65``, and mean P(normal) on this data is ~0.31, so it stays
# silent no matter how ``asymmetry_z_threshold`` is overridden (those posteriors
# are gate literals, not tunable parameters).  A one-alpha "multi-alpha" config
# silently exercised nothing: cross-alpha arbitration and the portfolio-netting
# shadow both need two live standing targets on one symbol.
#
# Known limit of this dataset: only sig_benign_midcap_v1 ever takes a *direction*
# on the cached APP sessions.  sig_kyle_drift_v1 and sig_hawkes_burst_v1 emit
# FLAT exclusively, so kyle contributes a zero standing target and the overlap
# this config produces is "one real target vs one zero", not a two-sided
# directional contest.  A FLAT is additionally dropped by
# ``is_redundant_gate_close_flat`` whenever the book is already flat, which is
# why some sessions show two emitting alphas and still zero contended ticks.
# Closing that gap needs data on which a second alpha takes a side, or a
# purpose-built research fixture alpha — not another config tweak.
alpha_specs:
  - alphas/sig_benign_midcap_v1/sig_benign_midcap_v1.alpha.yaml
  - alphas/sig_kyle_drift_v1/sig_kyle_drift_v1.alpha.yaml
  - alphas/sig_inventory_revert_v1/sig_inventory_revert_v1.alpha.yaml

# Inv-12 margin gate (G12-equivalent 1.5× round-trip floor), as in bt_app.
signal_min_edge_cost_ratio: 1.5

# Loosen the benign entry gate so it signals often enough to overlap the others
# (mirror bt_app's tuned overrides).
parameter_overrides:
  sig_benign_midcap_v1:
    entry_threshold_z: 1.5
    edge_per_z_bps: 6.0
